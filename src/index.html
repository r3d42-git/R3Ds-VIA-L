<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>R3Ds VIA-L</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="renderer.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand" aria-label="R3Ds VIA-L"><img src="AppIcon.png" alt="" width="30" height="30"><span>VIA-L</span></div>
    <nav aria-label="Werkzeug"><button id="via" class="tool selected" type="button" tabindex="-1">VIA</button><button id="vial" class="tool" type="button" tabindex="-1">Vial</button><button id="venom" class="tool" type="button" tabindex="-1">Venom</button><button id="wootility" class="tool" type="button" tabindex="-1">Wootility</button></nav>
    <div id="status" class="status" role="status">Bereit</div>
    <button id="reload" class="icon" type="button" tabindex="-1" title="Neu laden" aria-label="Neu laden">↻</button>
    <label class="zoom-label" for="zoom">Zoom</label>
    <select id="zoom" tabindex="-1" aria-label="Zoom"><option value="0.75">75 %</option><option value="0.8">80 %</option><option value="0.85">85 %</option><option value="0.9">90 %</option><option value="0.95">95 %</option><option value="1" selected>100 %</option><option value="1.05">105 %</option><option value="1.1">110 %</option><option value="1.15">115 %</option><option value="1.2">120 %</option><option value="1.25">125 %</option><option value="1.3">130 %</option><option value="1.35">135 %</option><option value="1.4">140 %</option><option value="1.45">145 %</option><option value="1.5">150 %</option></select>
    <button id="settings-button" class="icon" type="button" tabindex="-1" title="Einstellungen" aria-label="Einstellungen">⚙</button>
  </header>
  <section id="settings" class="settings" hidden aria-label="Einstellungen">
    <strong>Einstellungen</strong>
    <p>Werkzeugdaten und gespeicherte Gerätefreigaben zurücksetzen.</p>
    <button id="reset" type="button">Daten löschen</button>
    <div id="reset-confirmation" hidden role="group" aria-label="Löschen bestätigen">
      <label id="reset-label" for="reset-phrase"></label>
      <input id="reset-phrase" type="text" autocomplete="off" spellcheck="false">
      <div class="actions"><button id="reset-cancel" type="button">Abbrechen</button><button id="reset-confirm" type="button" disabled>Jetzt löschen</button></div>
    </div>
  </section>
  <main id="overlay" class="overlay" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
      <h1 id="overlay-title"></h1>
      <p id="overlay-text"></p>
      <div id="choices" class="choices"></div>
      <div class="actions"><button id="grant" type="button" disabled>Verbinden</button><button id="cancel" type="button">Abbrechen</button><button id="open" type="button" hidden>Im Browser öffnen</button></div>
    </section>
  </main>
</body>
</html>
